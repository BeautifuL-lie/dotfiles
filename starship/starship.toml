"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = '''$username$directory$git_branch$git_commit$git_status$cmd_duration 
$character'''

add_newline = false

[username]
show_always = true

[character]
success_symbol = "[🡺](text)"
error_symbol = "[🡺](red)"

[directory]
read_only = ""
truncation_length = 5
truncation_symbol = "../"
style = "bold text"

[git_branch]
symbol = " "

[git_commit]
tag_symbol = '  '

